# ==========================================================================
# Tsumo-Lab 設定ファイル
# ==========================================================================
# 店舗ごとの基本情報と「強い日」の定義を管理する。
# day_suffix: その店舗が出玉に力を入れる日の「1の位」(0-9)
# 例) day_suffix: [5, 0] → 5のつく日・10のつく日が対象

shops:
  - shop_id: "shop_001"
    name: "サンプルホールA店"
    area: "東京都新宿区"
    # この店舗が強いとされる日の1の位
    day_suffix_targets: [5, 0]
    # ゾロ目の日 (11日, 22日 等) も強いか
    zoro_target: true
    notes: "5のつく日と10日・20日・30日にジャグラー系が強い傾向"

  - shop_id: "shop_002"
    name: "サンプルホールB店"
    area: "東京都渋谷区"
    day_suffix_targets: [7]
    zoro_target: false
    notes: "7のつく日メイン。土日は回収傾向"

  - shop_id: "shop_003"
    name: "サンプルホールC店"
    area: "大阪府大阪市"
    day_suffix_targets: [1, 3]
    zoro_target: true
    notes: ""

# --------------------------------------------------------------------------
# グローバル設定
# --------------------------------------------------------------------------
settings:
  # データ取得元 URL のベース (将来のスクレイピング用)
  data_source_base_url: "https://example.com/data"
  # デフォルトの分析対象日数
  default_lookback_days: 90
