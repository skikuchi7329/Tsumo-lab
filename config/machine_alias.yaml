# ==========================================================================
# 機種名エイリアス定義 (名寄せ)
# ==========================================================================
# 同一機種の表記揺れを吸収するためのマッピング。
# キー: 正規化後の統一名称
# 値 (aliases): このキーに統一されるべき別名リスト
#
# 集計時にDB上の machine_name がいずれかの alias に一致した場合、
# キーの名称に統合して集計される。
#
# 例: 「L北斗の拳」「スマスロ北斗」「北斗の拳」は全て
#     「L北斗の拳」として統一集計される。

aliases:
  # --- 北斗の拳 ---
  "L北斗の拳":
    - "スマスロ北斗"
    - "北斗の拳"
    - "スマスロ北斗の拳"
    - "L北斗"

  # --- バジリスク ---
  "バジリスク絆2 天膳":
    - "バジリスク絆2"
    - "バジ絆2"
    - "SLOTバジリスク絆2天膳"

  # --- 押忍！番長 ---
  "押忍！番長ZERO":
    - "番長ZERO"
    - "番長ゼロ"
    - "押忍番長ZERO"

  # --- ジャグラーシリーズ ---
  "マイジャグラーV":
    - "マイジャグV"
    - "マイジャグ5"

  "ハッピージャグラーVIII":
    - "ハッピージャグラー8"
    - "ハピジャグ8"
    - "ハッピーV3"

  "アイムジャグラーEX":
    - "アイムEX"
    - "アイジャグEX"

  "ゴーゴージャグラー3":
    - "ゴージャグ3"
    - "ゴーゴージャグラー"

  # --- その他 ---
  "からくりサーカス":
    - "Lからくりサーカス"

  "甲鉄城のカバネリ":
    - "カバネリ"
    - "Lカバネリ"
